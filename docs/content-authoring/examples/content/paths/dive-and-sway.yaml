# 敵の移動 path。segments を順に、duration tick ずつ velocity で動く。
id: path.example_dive
version: 1
segments:
  - type: velocity
    duration: 60
    velocity: { x: 0, y: 2 }
  # offset は velocity の動きに重ねる揺れ（sine）。
  - type: velocity
    duration: 120
    velocity: { x: 0, y: 0 }
    offset: { type: sine, axis: x, amplitude: 32, periodTicks: 60 }
  - type: velocity
    duration: 120
    velocity: { x: 0, y: 3 }
