name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

  # browser smoke / regression test（design 21.5）。判定の正本は dump と replay の検査で、screenshot は Linux の baseline と比べる
  # （baseline は platform ごと）。screenshot を足したら browser-baselines workflow で Linux の baseline を作って commit する。baseline
  # のない screenshot は失敗し、darwin の baseline に対応する Linux の baseline がなければ warning も出す。
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser test
        run: npm run test:browser

      - name: Report missing Linux screenshot baselines
        if: always()
        run: |
          find apps/sample-title/e2e/__screenshots__ -name '*-darwin.png' | sort | while read -r darwin; do
            if [ ! -f "${darwin%-darwin.png}-linux.png" ]; then
              echo "::warning file=${darwin}::no Linux screenshot baseline; run the Browser baselines workflow and commit it"
            fi
          done

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/sample-title/test-results
          retention-days: 7
