name: Browser baselines

# Linux の screenshot baseline を作る（手動で実行する。workflow_dispatch は default branch にある workflow だけを実行できる）。CI の
# browser job と同じ runner で、baseline のない screenshot だけを書き出して（`--update-snapshots=missing`。既にある baseline は
# 上書きせずに比べる）、`*-linux.png` を artifact にする。artifact は `apps/sample-title/e2e/__screenshots__` からの相対 path なので、
# 同じ directory に展開し、中身を確かめてから commit し、ci.yml の ALLOW_MISSING_BROWSER_BASELINES を外す。
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # `--update-snapshots=missing` は足りない baseline を書き出したうえで、その test を失敗として報告する。書き出した baseline を
      # artifact にするのが目的なので、この step の失敗では job を止めない（書き出せたかは artifact の中身で確かめる）。
      - name: Write missing screenshot baselines
        run: npm run test:browser -- --update-snapshots=missing
        continue-on-error: true

      - name: Upload Linux screenshot baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-baselines-linux
          path: apps/sample-title/e2e/__screenshots__/**/*-linux.png
          retention-days: 7
